<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>OJ 社区首页</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h1>OJ 社区</h1>
    <div id="signup-section">
        <h2>注册</h2>
        <input type="email" id="signup-email" placeholder="邮箱">
        <input type="password" id="signup-password" placeholder="密码">
        <button id="btn-signup">注册</button>
    </div>
    <div id="signin-section">
        <h2>登录</h2>
        <input type="email" id="signin-email" placeholder="邮箱">
        <input type="password" id="signin-password" placeholder="密码">
        <button id="btn-signin">登录</button>
    </div>

<script>
const SUPABASE_URL = 'https://wcdwjygfboktwdjywgkx.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_Evi9vhKB8ZhVPkr70bwCyQ_yrzC9xzi';

const { createClient } = supabase;
const supabaseClient = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

async function handleSignUp(email, password) {
    const { data, error } = await supabaseClient.auth.signUp({ email: email, password: password });
    if (error) { alert('注册失败：' + error.message); } 
    else { alert('注册成功！请去后台确认'); }
}

async function handleSignIn(email, password) {
    const { data, error } = await supabaseClient.auth.signInWithPassword({ email: email, password: password });
    if (error) { alert('登录失败：' + error.message); } 
    else { alert('登录成功！'); }
}

document.getElementById('btn-signup').addEventListener('click', function() {
    let email = document.getElementById('signup-email').value;
    let password = document.getElementById('signup-password').value;
    handleSignUp(email, password);
});

document.getElementById('btn-signin').addEventListener('click', function() {
    let email = document.getElementById('signin-email').value;
    let password = document.getElementById('signin-password').value;
    handleSignIn(email, password);
});
</script>
</body>
</html>
