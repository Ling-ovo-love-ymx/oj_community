<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>OJ 社区</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<h1>OJ 社区</h1>

<h2>注册</h2>
<input type="email" id="reg_email" placeholder="邮箱">
<input type="password" id="reg_password" placeholder="密码">
<button onclick="register()">注册</button>

<h2>登录</h2>
<input type="email" id="login_email" placeholder="邮箱">
<input type="password" id="login_password" placeholder="密码">
<button onclick="login()">登录</button>

<script>
const supabase = window.supabase.createClient(
  'https://wcdjwyjgfboktwdijwgkx.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndjZGp3eWpnZmJva3R3ZGlqd2dreCIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzU4NjA3NDAwLCJleHAiOjIwNzM5NjM0MDB9.1x0jWjx-WyL9k7k3b4YV8zQZQZQZQZQZQZQZQZQZQZQ'
);

async function register() {
  const email = document.getElementById('reg_email').value;
  const password = document.getElementById('reg_password').value;
  const { error } = await supabase.auth.signUp({ email, password });
  if (error) alert('注册失败: ' + error.message);
  else alert('注册成功！请去邮箱收确认邮件！');
}

async function login() {
  const email = document.getElementById('login_email').value;
  const password = document.getElementById('login_password').value;
  const { data, error } = await supabase.auth.signInWithPassword({ email, password });
  
  if (error) {
    alert('登录失败: ' + error.message);
  } else {
    alert('登录成功！');
    window.location.href = '/index.html';
  }
}
</script>
</body>
</html>
